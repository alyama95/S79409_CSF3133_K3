<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Campus Bookstore</title>
    <!-- Google Fonts: Roboto and Merriweather -->
    <link href="https://fonts.googleapis.com/css?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shop.css">
</head>
<body>
    <!-- 
      Error Identification List (Part 1):
      1. shop.html, Line 6: rel="stylesheets" incorrect attribute value; should be rel="stylesheet".
      2. shop.html, Line 18: style="color=#1B4F72;" invalid inline CSS syntax; should use colon style="color: #1B4F72;".
      3. shop.css, Line 2: font-family: 'Robotto' misspelled font name; should be 'Roboto'.
      4. shop.css, Line 3: background-repeat: no repeat invalid value; should be no-repeat.
      5. shop.css, Line 5: bacground-position misspelled property name; should be background-position.
      6. shop.css, Line 18: display: inline; should be display: block; for proper navigation link padding and layout.
      7. shop.css, Line 23: li:a:hover invalid pseudo-class syntax; should be li a:hover or a:hover.
      8. shop.css, Line 26: #products selector mismatch with HTML id="product"; should match (#product).
      9. shop.css, Line 27: border-collapse: collapsed; invalid value; should be collapse.
      10. shop.css, Line 34: tr:nth-child(2) only targets the second row; should be tr:nth-child(even) for alternating rows.
      11. shop.css, Line 37: tr:hovered invalid pseudo-class; should be tr:hover.
      12. shop.css, Line 45: background-color: #f1f1f1 missing semicolon.
    -->

    <header>
        <h1>Campus Bookstore</h1>
        <p>Textbooks, stationery and more for every student.</p>
    </header>

    <nav>
        <ul>
            <li><a href="#home" class="active">Home</a></li>
            <li><a href="#books">Books</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Available Products</h2>
            <table id="product">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Category</th>
                        <th class="price-header">Price (RM)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Web Design Basics</td>
                        <td>Textbook</td>
                        <td class="price-col">45.00</td>
                    </tr>
                    <tr>
                        <td>A4 Notebook</td>
                        <td>Stationery</td>
                        <td class="price-col">6.50</td>
                    </tr>
                    <tr>
                        <td>USB Drive 32GB</td>
                        <td>Gadget</td>
                        <td class="price-col">25.00</td>
                    </tr>
                    <tr>
                        <td>Highlighter Set</td>
                        <td>Stationery</td>
                        <td class="price-col">9.90</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Campus Bookstore</p>
    </footer>
</body>
</html>
