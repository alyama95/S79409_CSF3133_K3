<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Web Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="quiz-header">
    <h1>
		Web Development Quiz
	</h1>
    <p>
		Test your knowledge with randomized questions and a countdown timer.
	</p>
  </header>

  <main class="quiz-container">
    <section class="quiz-status" aria-label="Quiz status">
		<span id="question-progress">
			Question 1 of 5
		</span>
		<span id="timer" class="timer">
			Time Left: 15s
		</span>
    </section>

    <section class="question-section" aria-live="polite">
		<h2 id="question-text">
			Loading question...
		</h2>
		<div id="options-container" class="options-grid" role="radiogroup" aria-label="Answer options"></div>
    </section>

    <section id="feedback-section" class="feedback-section" aria-live="polite"></section>

    <section class="controls-section">
		<button id="submit-btn" type="button" class="btn btn-primary">
			Submit Answer
		</button>
		<button id="next-btn" type="button" class="btn btn-secondary" disabled>
			Next Question
		</button>
		<button id="restart-btn" type="button" class="btn btn-outline hidden">
			Play Again
		</button>
    </section>
  </main>

  <footer id="score-footer" class="quiz-footer">
	<p id="score-display">
		Score: 0
	</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
