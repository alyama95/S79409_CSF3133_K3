<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Rock, Paper, Scissors Game</title>
	<link rel="stylesheet" href="style2.css" />
</head>
<body>
	<!-- Header with game title and short instructions -->
	<header class="header">
		<h1>Rock, Paper, Scissors Game</h1>
		<p>Enter your name, click Start Game, then choose Rock, Paper, or Scissors.</p>
	</header>

	<main class="container">
		<!-- Player name input and start button -->
		<section class="player-section">
			<label for="playerName">
				Your name:
			</label>
			<input type="text" id="playerName" placeholder="Enter your name" />
			<button type="button" onclick="startGame()">
				Start Game
			</button>
			<p id="welcomeMessage"></p>
		</section>

		<!-- Choice buttons and player vs. computer images -->
		<section class="game-section">
			<div class="choices-buttons">
				<button type="button" onclick="playRound('rock')">
					Rock
				</button>
				<button type="button" onclick="playRound('paper')">
					Paper
				</button>
				<button type="button" onclick="playRound('scissors')">
					Scissors
				</button>
			</div>

		  <div class="arena">
			<div class="player-box">
				<p class="label">
					You
				</p>
				<img id="playerImg" src="rock.png" alt="Player choice" />
			</div>

			<div class="vs">
				VS
			</div>

			<div class="computer-box">
				<p class="label">
					Computer
				</p>
				<img id="computerImg" src="rock.png" alt="Computer choice" />
			</div>
		  </div>
		</section>

		<!-- Round result and scoreboard -->
		<section class="result-section">
			<p id="result"></p>
			<div class="scoreboard">
				<span>
					Wins: 
				<span id="wins">0</span></span>
				<span>
					Losses: 
				<span id="losses">0</span></span>
				<span>
					Draws: 
				<span id="draws">0</span></span>
			</div>
		</section>

		<!-- Round history table and summary/reset controls -->
		<section class="history-section">
			<h2>History</h2>
			<table id="history">
				<tr>
					<th>Round</th>
					<th>You</th>
					<th>Computer</th>
					<th>Result</th>
				</tr>
		  </table>

		  <div class="actions">
			<button type="button" onclick="showSummary()">
				Show Summary
			</button>
			<button type="button" onclick="resetGame()">
				Reset
			</button>
		  </div>
		  <p id="summary"></p>
		</section>
	</main>

	<!-- Footer displaying start time and copyright -->
	<footer class="footer">
		<p id="startTime"></p>
		  <p>&copy; 2026 Computer Science Club</p>
	</footer>

	<!-- External JavaScript file -->
	<script src="game.js"></script>
</body>
</html>
